
services:

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - sql-data:/var/opt/mssql

  delivery-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DeliveryPlatformDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__RedisConnection: "redis:6379"
      JwtOptions__SecretKey: ${JWT_SECRET}
    depends_on:
      - redis
      - sqlserver

volumes:
  sql-data:
